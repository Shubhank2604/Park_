spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: parking-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/park?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:park}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:parking-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.park.common.events

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${SERVER_PORT:8080}

app:
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    attendant-username: ${SEED_ATTENDANT_USERNAME:attendant1}
    attendant-password: ${SEED_ATTENDANT_PASSWORD:}
    user-username: ${SEED_USER_USERNAME:user1}
    user-password: ${SEED_USER_PASSWORD:}
